; Snowlayer keyboard firmware — CH32X035G8U6
; Community CH32V platform + WCH openwch Arduino core.
; Docs: https://github.com/Community-PIO-CH32V/platform-ch32v

[env]
platform     = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board        = genericCH32X035G8U6
framework    = arduino

build_flags =
    -Os

; Warnings on our own code only — the Arduino core and vendored library are
; noisy and we do not control them. (Section GC and -fno-exceptions are already
; applied by the platform; adding them here changed the binary by 0 bytes.)
build_src_flags =
    -Wall -Wextra

[env:snowlayer]

; --- Flashing --------------------------------------------------------------
; Default: the CH32X035's factory USB bootloader, over the board's own USB-C
; port. Needs no programmer hardware. Runs `wchisp flash`.
;
; The board must be IN BOOTLOADER MODE first, or wchisp finds nothing:
;   - blank flash: nothing to do, the chip falls through to the boot ROM, or
;   - with firmware on it: hold A while plugging in.
; Check it took with `lsusb` — you want 1a86:55e0.
;
; There is no hardware boot pad on this revision — NRST (PC3) is unconnected.
; The pads near the top right are SW41, a solder jumper to +5V; shorting them
; damages a GPIO and does not enter the bootloader.
; The protocol is `isp` — the tool it runs is `wchisp`, but naming the tool here
; makes pio print "Unknown upload protocol" and silently skip the upload while
; still reporting SUCCESS. Valid names for this board: wch-link, minichlink,
; isp, wlink.
upload_protocol = isp
;
; Have a WCH-LinkE probe? Use this instead. Wire three lines and leave the
; probe's 3V3 disconnected — the board powers itself from its own USB-C:
;
;   LinkE SWDIO -> TP2  (PC18/SWDIO)
;   LinkE SWCLK -> TP1  (PC19/SWDCK)
;   LinkE GND   -> any GND
;
; TP1/TP2 are the 1.0mm pads at x=125.68, y=129.75 and y=132.75. Swapping the
; two signal lines is harmless — the probe just fails to find the chip.
; Check the link with `wlink status` before flashing. If it reports the wrong
; mode, the probe shipped in ARM mode: `wlink set-mode rv`.
;
; This is the only recovery path that does not depend on the firmware working,
; so it is what gets you back in after a bad flash. `wlink erase` returns the
; chip to blank, which restores the boot-ROM fallthrough on every plug-in.
;
; "Error: open failed" from openocd means this is selected but no probe is
; plugged in.
; upload_protocol = wch-link

; --- Bring-up test ---------------------------------------------------------
; Scratch env for bisecting hardware/firmware problems in isolation. Whatever
; is currently in boottest/ gets built instead of src/. Flash it over SWD:
;
;   pio run -e boottest -t upload
[env:boottest]
build_src_filter = -<*> +<../boottest/>
upload_protocol = wch-link
